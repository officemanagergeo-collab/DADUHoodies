<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DADU | Hoodies</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 28px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #252b38;
}
.logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 5px;
}
nav a {
  color: white;
  text-decoration: none;
  margin-left: 25px;
  font-size: 12px;
  letter-spacing: 2px;
}
.hero {
  text-align: center;
  padding: 55px 20px 25px;
}
.hero h1 {
  font-size: 42px;
  letter-spacing: 5px;
}
.hero p {
  color: #aab5ca;
  letter-spacing: 4px;
}
.product {
  max-width: 850px;
  margin: 35px auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 35px;
}
.main-photo {
  width: 100%;
  height: 430px;
  object-fit: cover;
  background: #151b28;
}
.thumbnails {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.thumbnails img {
  width: 65px;
  height: 70px;
  object-fit: cover;
  cursor: pointer;
  border: 1px solid #30394b;
}
.details h2 {
  letter-spacing: 3px;
  font-size: 27px;
}
.details p { color: #aab5ca; }
.colors button, .sizes button {
  background: transparent;
  border: 1px solid #66718a;
  color: white;
  padding: 12px 15px;
  margin: 5px 4px 5px 0;
  cursor: pointer;
}
.colors button:hover, .sizes button:hover {
  background: #172c50;
}
.order {
  margin-top: 25px;
  width: 100%;
  padding: 16px;
  background: #172c50;
  border: none;
  color: white;
  letter-spacing: 3px;
  cursor: pointer;
}
footer {
  text-align: center;
  padding: 35px;
  color: #77839a;
  letter-spacing: 3px;
}
@media(max-width:650px) {
  .product { grid-template-columns: 1fr; }
  .main-photo { height: 350px; }
  header { padding: 20px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">DADU</div>
  <nav><a href="#">HOME</a><a href="#shop">SHOP</a></nav>
</header>

<section class="hero">
  <h1>ESSENTIAL HOODIE</h1>
  <p>WEAR YOUR MOOD.</p>
</section>

<section class="product" id="shop">
  <div>
    <img class="main-photo" id="mainPhoto" src="1.png" alt="DADU Hoodie">
    <div class="thumbnails" id="thumbnails"></div>
  </div>

  <div class="details">
    <h2>DADU HOODIE</h2>
    <p>Minimal design. Everyday comfort.</p>

    <h3>COLOR</h3>
    <div class="colors">
      <button onclick="showPhotos('black')">BLACK</button>
      <button onclick="showPhotos('white')">WHITE</button>
      <button onclick="showPhotos('blue')">NAVY BLUE</button>
    </div>

    <h3>SIZE</h3>
    <div class="sizes">
      <button onclick="chooseSize('S')">S</button>
      <button onclick="chooseSize('M')">M</button>
      <button onclick="chooseSize('L')">L</button>
      <button onclick="chooseSize('XL')">XL</button>
    </div>

    <p id="selectedSize">Select your size</p>
    <h3>PRICE COMING SOON</h3>
    <button class="order" onclick="alert('Online ordering coming soon!')">ORDER NOW</button>
  </div>
</section>

<footer>DADU © 2026</footer>

<script>
const photos = {
  black: ["1.png", "2.png", "3.png", "4.png", "5.png"],
  white: ["wt1.png", "wt2.png", "wt3.png", "wt4.png", "wt5.png"],
  blue: ["blue1.png", "blue2.png", "blue3.png", "bl4.png", "bl5.png"]
};

function showPhotos(color) {
  const main = document.getElementById("mainPhoto");
  const thumbs = document.getElementById("thumbnails");

  main.src = photos[color][0];
  thumbs.innerHTML = "";

  photos[color].forEach(photo => {
    const img = document.createElement("img");
    img.src = photo;
    img.onclick = () => main.src = photo;
    thumbs.appendChild(img);
  });
}

function chooseSize(size) {
  document.getElementById("selectedSize").innerText = "Selected size: " + size;
}

showPhotos("black");
</script>

</body>
</html>
