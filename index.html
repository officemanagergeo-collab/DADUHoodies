
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DADU | Wear Your Mood</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090b10;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 28px 20px;
  text-align: center;
  border-bottom: 1px solid #252a35;
}

.logo {
  font-size: 38px;
  letter-spacing: 9px;
  font-weight: bold;
}

.tagline {
  color: #8b9bb8;
  letter-spacing: 4px;
  font-size: 11px;
  margin-top: 8px;
}

.hero {
  text-align: center;
  padding: 65px 20px 45px;
}

.hero h1 {
  font-size: clamp(34px, 7vw, 65px);
  letter-spacing: 5px;
}

.hero p {
  color: #aab3c4;
  margin-top: 15px;
  letter-spacing: 2px;
}

.collection {
  max-width: 1150px;
  margin: 25px auto 65px;
  padding: 0 20px;
}

.collection-title {
  text-align: center;
  margin-bottom: 30px;
}

.collection-title h2 {
  font-size: 27px;
  letter-spacing: 3px;
}

.collection-title p {
  color: #aab3c4;
  margin-top: 10px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 25px;
}

.product {
  background: #11151e;
  border: 1px solid #252c3a;
  padding: 15px;
  border-radius: 5px;
}

.main-image {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  background: #1a1e28;
  display: block;
}

.thumbnails {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin-top: 10px;
  padding-bottom: 5px;
}

.thumbnails img {
  width: 58px;
  height: 68px;
  object-fit: cover;
  cursor: pointer;
  border: 1px solid #41495a;
  opacity: .7;
}

.thumbnails img:hover {
  opacity: 1;
  border-color: #9aabc9;
}

.product h3 {
  margin-top: 20px;
  font-size: 20px;
  letter-spacing: 1px;
}

.price {
  color: #a9bbdc;
  font-size: 21px;
  font-weight: bold;
  margin-top: 10px;
}

.options {
  margin-top: 18px;
}

.options label {
  display: block;
  color: #aab3c4;
  font-size: 13px;
  margin-bottom: 8px;
}

.options select {
  width: 100%;
  padding: 12px;
  background: #090b10;
  color: white;
  border: 1px solid #41495a;
  margin-bottom: 14px;
}

.order {
  display: block;
  width: 100%;
  padding: 15px;
  background: #172641;
  color: white;
  text-align: center;
  text-decoration: none;
  letter-spacing: 2px;
  margin-top: 10px;
  border: 1px solid #526887;
}

.order:hover {
  background: #263d60;
}

footer {
  text-align: center;
  padding: 35px 15px;
  border-top: 1px solid #252a35;
  color: #8993a5;
}

footer a {
  color: #a9bbdc;
  text-decoration: none;
}

@media(max-width: 600px) {
  .hero {
    padding: 45px 15px;
  }

  .collection {
    padding: 0 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">DADU</div>
  <div class="tagline">WEAR YOUR MOOD</div>
</header>

<section class="hero">
  <h1>FIND YOUR STYLE</h1>
  <p>YOUR MOOD. YOUR STYLE. YOUR DADU.</p>
</section>

<div id="collections"></div>

<footer>
  <p>DADU — WEAR YOUR MOOD.</p>
  <p style="margin-top:12px">
    Instagram:
    <a href="https://www.instagram.com/daduhoodies/" target="_blank">
      @daduhoodies
    </a>
  </p>
</footer>

<script>
const collections = [
  {
    name: "ESSENTIAL COLLECTION",
    description: "Everyday comfort. Timeless style.",
    products: [
      {
        name: "Essential Hoodie",
        price: 60,
        colors: {
          "Black": ["1.png", "2.png", "3.png", "4.png", "5.png"],
          "White": ["wt1.png", "wt2.png", "wt3.png", "wt4.png", "wt5.png"],
          "Navy Blue": ["blue1.png", "blue2.png", "blue3.png", "bl4.png", "bl5.png"]
        }
      }
    ]
  },
  {
    name: "NEW COLLECTION",
    description: "New colors. Same DADU attitude.",
    products: [
      {
        name: "New Collection Hoodie",
        price: 70,
        colors: {
          "Black": ["1.png"],
          "Brown": ["br1.png", "br2.png", "br3.png", "br4.png", "br5.png"],
          "Red": ["red1.png", "red2.png", "red3.png", "red4.png", "red5.png", "red6.png"],
          "Yellow": ["yell1.png", "yell2.png", "yell3.png", "yell4.png", "yell5.png"]
        }
      }
    ]
  },
  {
    name: "JACKET COLLECTION",
    description: "A new layer. A new statement.",
    products: [
      {
        name: "DADU Jacket",
        price: 140,
        colors: {
          "Black": [
            "bk1.png", "bk2.png", "bk3.png", "bk4.png",
            "bk5.png", "bk6.png", "bk7.png"
          ],
          "Gray": ["gray1.png", "gray2.png", "gray3.png"]
        }
      }
    ]
  }
];

const container = document.getElementById("collections");

collections.forEach(collection => {
  const section = document.createElement("section");
  section.className = "collection";

  section.innerHTML = `
    <div class="collection-title">
      <h2>${collection.name}</h2>
      <p>${collection.description}</p>
    </div>
    <div class="products"></div>
  `;

  const productsArea = section.querySelector(".products");

  collection.products.forEach(product => {
    const colors = Object.keys(product.colors);
    const firstColor = colors[0];

    const card = document.createElement("div");
    card.className = "product";

    card.innerHTML = `
      <img class="main-image" src="${product.colors[firstColor][0]}" alt="${product.name}">
      <div class="thumbnails"></div>

      <h3>${product.name}</h3>
      <div class="price">${product.price} ₾</div>

      <div class="options">
        <label>COLOR</label>
        <select class="color-select">
          ${colors.map(color =>
            `<option value="${color}">${color}</option>`
          ).join("")}
        </select>

        <label>SIZE</label>
        <select class="size-select">
          <option value="">Choose size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </div>

      <a class="order" href="https://ig.me/m/daduhoodies" target="_blank">
        ORDER VIA INSTAGRAM
      </a>
    `;

    const mainImage = card.querySelector(".main-image");
    const thumbnails = card.querySelector(".thumbnails");
    const colorSelect = card.querySelector(".color-select");

    function showImages(color) {
      const selectedImages = product.colors[color];

      mainImage.src = selectedImages[0];
      thumbnails.innerHTML = "";

      selectedImages.forEach(file => {
        const thumb = document.createElement("img");
        thumb.src = file;
        thumb.alt = product.name;

        thumb.addEventListener("click", () => {
          mainImage.src = file;
        });

        thumbnails.appendChild(thumb);
      });
    }

    colorSelect.addEventListener("change", () => {
      showImages(colorSelect.value);
    });

    showImages(firstColor);
    productsArea.appendChild(card);
  });

  container.appendChild(section);
});
</script>

</body>
</html>
